      height: 100%;
      object-fit: cover;
      display: block;

  const f = btn.dataset.filter;
  const label = f === 'all' ? '全部' : f;
  const n = counts[f] || 0;
  btn.textContent = `${label} ${f === 'all' ? videos.length : n}`;
});

// 创建卡片 DOM
function makeCard(v, i) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.role = v.role;
  card.dataset.title = v.title;
  card.innerHTML = `
    <div class="video-wrap">
      <div class="video-skeleton"></div>
      <video
        data-src="${v.url}"
        preload="none"
        playsinline
        muted
        data-index="${i}"
      ></video>
      <div class="cover-overlay">
        <div class="play-btn">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
    </div>
    <div class="card-info">
      <div class="card-title">${v.title}</div>
      <span class="card-tag tag-${v.role}">${v.role}</span>
    </div>
  `;
  card.querySelector('.video-wrap').addEventListener('click', () => openModal(v.url, v.title));
  return card;
}

// 按精选顺序 + 其余视频的顺序合并渲染
const featuredSet = new Set(featuredTitles);
const grid = document.getElementById('videoGrid');

// 先渲染精选（按指定顺序）
featuredTitles.forEach((title, i) => {
  const v = videos.find(x => x.title === title);
  if (!v) return;
  grid.appendChild(makeCard(v, 1000 + i));
});

// 再渲染其余视频（原始顺序，跳过已在精选中的）
videos.forEach((v, i) => {
  if (featuredSet.has(v.title)) return;
  grid.appendChild(makeCard(v, i));
});

// ── 视频列表顺序与 COVERS 数组一一对应 ──
// videos 数组的顺序决定了 COVERS[i] 对应哪个视频
// 但渲染时精选视频会被重排，所以需要按 url 建立映射

// 建立 url -> cover dataURL 的映射
// videos 数组顺序 = covers 截帧顺序（grab_covers.sh 按 videos 顺序截）
const urlToCover = {};
videos.forEach((v, i) => {
  if (COVERS[i]) urlToCover[v.url] = COVERS[i];
});

// ── 直接用静态封面，无需 Canvas 取帧 ──
function loadCover(wrap) {
  if (wrap.dataset.loaded) return;
  wrap.dataset.loaded = '1';

  const video = wrap.querySelector('video');
  if (!video) return;
  const url = video.dataset.src || video.src;
  const coverSrc = urlToCover[url];

  if (coverSrc) {
    const img = document.createElement('img');
    img.src = coverSrc;
    img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
    wrap.insertBefore(img, wrap.querySelector('.cover-overlay'));
  }
  wrap.classList.add('loaded');
}

// ── 首屏立即渲染，其余 IntersectionObserver 提前触发 ──
const allWraps = Array.from(document.querySelectorAll('.video-wrap'));

// 前12个立即显示（封面是静态图，瞬间完成）
allWraps.slice(0, 12).forEach(wrap => loadCover(wrap));

// 其余 rootMargin 600px 提前加载
const lazyObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    loadCover(entry.target);
    lazyObserver.unobserve(entry.target);
  });
}, { rootMargin: '600px' });

allWraps.slice(12).forEach(wrap => lazyObserver.observe(wrap));

// 筛选后重新观察
function reobserveLazy() {
  document.querySelectorAll('.video-wrap').forEach(wrap => {
    if (!wrap.dataset.loaded) lazyObserver.observe(wrap);
  });
}

// 模态播放器
const backdrop = document.getElementById('modalBackdrop');
const modalVideo = document.getElementById('modalVideo');
const modalTitle = document.getElementById('modalTitle');
const modalClose = document.getElementById('modalClose');

function openModal(url, title) {
  modalVideo.src = url;
  modalTitle.textContent = title;
  backdrop.classList.add('open');
  modalVideo.play();
}

function closeModal() {
  backdrop.classList.remove('open');
  modalVideo.pause();
  modalVideo.src = '';
}

modalClose.addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// 筛选
const statsBar = document.getElementById('statsBar');
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    let shown = 0;
    document.querySelectorAll('.card').forEach(card => {
      const match = filter === 'all' || card.dataset.role === filter;
      card.classList.toggle('hidden', !match);
      if (match) shown++;
    });
    const label = filter === 'all' ? '全部' : filter === '其他' ? '未分类' : filter;
    statsBar.innerHTML = `<span>显示 ${label} · 共 ${shown} 支</span>`;
    // 筛选后触发懒加载
    setTimeout(reobserveLazy, 50);
  });
});
